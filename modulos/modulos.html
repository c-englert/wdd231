<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exemplo de Módulos: Curso e Seções</title>
  <meta name="description" content="Atividade de aprendizagem da semana 3 do WDD231: módulos ES em JavaScript.">
  <meta name="author" content="Claudio Englert">
  <link rel="stylesheet" href="estilos/modulos.css">
  <script type="module" src="scripts/modulos.mjs"></script>
</head>

<body>
  <main>
    <h1 id="nomeCurso">Desenvolvimento Frontend para Web I</h1>
    <h2 id="codigoCurso">WDD231</h2>

    <div id="matricula">
      <p>Escolha uma seção:</p>
      <select id="numeroSecao">
        <option value="0" disabled selected>--</option>
      </select>
      <button id="matricularEstudante">Matricular Estudante</button>
      <button id="removerEstudante">Remover Estudante</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Seção</th>
          <th>Matriculado</th>
          <th>Instrutor</th>
        </tr>
      </thead>
      <tbody id="secoes"></tbody>
    </table>
  </main>
</body>

</html>
